<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - IFG</title>
    <!-- O Bootstrap deve vir ANTES do seu CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- CABEÇALHO ORIGINAL COM BOTÃO HAMBÚRGUER -->
    <header style="background-color: #f4f4f4;">
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container-fluid px-4">
                
                <!-- GRUPO ESQUERDA: Logótipo + Botão Hambúrguer -->
                <div class="d-flex align-items-center gap-3">
                    
                    <!-- O logótipo do IFG -->
                    <a class="navbar-brand m-0" href="index.html">
                        <img src="img/logo.png" alt="Logo do IFG" width="200">
                    </a>
                    
                    <!-- Botão Hambúrguer (Dropdown) -->
                    <div class="dropdown">
                        <!-- A classe d-block garante que o botão fica sempre visível -->
                        <button class="navbar-toggler border-dark d-block" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        
                        <!-- Lista que abre ao clicar no botão -->
                        <ul class="dropdown-menu">
                            
                            <!-- OPÇÕES: NÃO LOGADO -->
                            <li class="opcao-deslogada"><a class="dropdown-item fw-bold" href="login.html">Entrar</a></li>
                            <li class="opcao-deslogada"><a class="dropdown-item fw-bold" href="cadastro.html">Cadastrar</a></li>
                            
                            <!-- OPÇÕES: LOGADO (Escondidas por padrão) -->
                            
                            <li class="opcao-logada" style="display: none;"><a class="dropdown-item fw-bold" href="carrinho.html">Meus Pedidos</a></li>
                            <li class="opcao-logada" style="display: none;"><hr class="dropdown-divider"></li>
                            <li class="opcao-logada" style="display: none;"><button class="dropdown-item fw-bold text-danger" onclick="fazerLogout()">Sair</button></li>
                            
                        </ul>
                    </div>

                </div>
                
                <!-- GRUPO DIREITA: Os seus links originais -->
                <div class="collapse navbar-collapse justify-content-end d-none d-lg-flex" id="menuPrincipal">
                    <ul class="navbar-nav gap-4">
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-bold" href="index.html">Página Inicial</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-bold" href="pg_produtos.html">Produtos</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-bold" href="contato.html">Contato</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-dark fw-bold" href="carrinho.html">Carrinho</a>
                        </li>
                    </ul>
                </div>

            </div>
        </nav>
    </header>

    <!-- Carrossel Automático com as suas imagens -->
    <div id="carouselExampleAutoplaying" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="img/imgtela.jpg" class="d-block w-100 rounded-5" alt="Tela 1">
            </div>
            
            <div class="carousel-item" data-bs-interval="3000">
                <img src="img/imgtela1.jpg" class="d-block w-100 rounded-5" alt="Tela 2">
            </div>

        </div>
        
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Próximo</span>
        </button>
    </div>

    <!-- Script do Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script para controlar as opções de Login/Logout DENTRO do Hambúrguer -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const usuarioLogado = localStorage.getItem("usuarioLogado");
            
            const itensDeslogados = document.querySelectorAll(".opcao-deslogada");
            const itensLogados = document.querySelectorAll(".opcao-logada");

            if (usuarioLogado) {
                // Esconde as opções de Entrar/Cadastrar e mostra as da conta
                itensDeslogados.forEach(item => item.style.display = "none");
                itensLogados.forEach(item => item.style.display = "block");
            } else {
                // Mostra as opções de Entrar/Cadastrar e esconde as da conta
                itensDeslogados.forEach(item => item.style.display = "block");
                itensLogados.forEach(item => item.style.display = "none");
            }
        });

        function fazerLogout() {
            localStorage.clear(); 
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
