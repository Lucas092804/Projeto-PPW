<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho - MDG Informatica</title>
    <!-- Bootstrap para suporte a badges e ícones -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="stylecarrinho.css">
</head>
<body>

    <!-- Cabeçalho em Flexbox -->
    <header class="header">
        <img src="img/logo.png" alt="Logo do IFG" width="200">
        
        <nav>
            <ul class="menu" style="display: flex; align-items: center; gap: 15px; list-style: none; margin: 0;">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="pg_produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contato</a></li>
                
                <!-- LINK DO CARRINHO COM ÍCONES E BADGE -->
                <li style="position: relative;">
                    <a href="carrinho.html" style="display: flex; align-items: center; gap: 5px; text-decoration: none;">
                        <svg id="icone-carrinho-vazio" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart" viewBox="0 0 16 16">
                            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .491.592l-1.5 8A.5.5 0 0 1 13 12H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l1.313 7h8.17l1.313-7H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                        <svg id="icone-carrinho-cheio" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-cart-fill" viewBox="0 0 16 16">
                            <path d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                        Carrinho
                        <span id="badge-carrinho" class="badge rounded-pill bg-danger" style="display: none; position: absolute; top: -10px; right: -15px; font-size: 0.70rem;">0</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <!-- Conteúdo Principal do Carrinho -->
    <main class="carrinho-container">
        <h1>Meu Carrinho de Compras</h1>

        <div class="carrinho-conteudo">
            <!-- Lista Dinâmica dos Produtos -->
            <section class="lista-produtos" id="lista-produtos">
                <!-- Os produtos salvos no localStorage serão renderizados aqui pelo JS -->
            </section>

            <!-- Caixa Lateral: Resumo do Pedido -->
            <aside class="resumo-pedido">
                <h2>Resumo do Pedido</h2>
                <br>
                <p id="total-itens-texto">Total (0 produtos):</p>
                <h3 class="preco-total" id="preco-total">R\$ 0,00</h3>
                <p class="parcelamento" id="parcelamento-texto">Em até 10x sem juros de R\$ 0,00</p>
                <br>
                <a href="carrinhosucesso.html" class="btn-finalizar" id="btn-finalizar">Finalizar pedido</a>
                <br>
                <a href="pg_produtos.html" class="btn-voltar">Retornar à Lista de Produtos</a>
            </aside>
        </div>
    </main>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 MDG Informatica.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const CHAVE_CARRINHO = 'carrinho_mdg';

        // Base de dados local dos produtos cadastrados no site
        const PRODUTOS_BD = {
            'pc-gamer-ryzen7': {
                nome: 'PC Gamer Ryzen 7 5700x',
                descricao: '32gb Ddr4 3200mhz, RTX 4060 8GB, SSD 1TB Nvme, Rosa – Full Pink Premium Water Cooler RGB E Cabos Sleeved.',
                preco: 8999.99,
                imagem: 'img/pcxuxa.jpg'
            },
            'desktop-dell-24': {
                nome: 'Desktop Dell 24',
                descricao: 'All-in-One 8GB 512G Windows 11 Pro.',
                preco: 7499.99,
                imagem: 'img/pcvei.JPG'
            },
            'notebook-acer-nitro': {
                nome: 'Notebook Gamer Acer Nitro',
                descricao: 'Intel® Core® i5, NVIDIA GTX 1650, 8GB RAM, 512GB SSD, Linux Gutta.',
                preco: 4899.99,
                imagem: 'img/pcben10.jpg'
            }
        };

        // Carrega e renderiza o carrinho ao abrir a página
        document.addEventListener("DOMContentLoaded", function() {
            renderizarCarrinho();
        });

        function renderizarCarrinho() {
            const carrinho = JSON.parse(localStorage.getItem(CHAVE_CARRINHO)) || [];
            const containerLista = document.getElementById('lista-produtos');
            
            containerLista.innerHTML = '';

            if (carrinho.length === 0) {
                containerLista.innerHTML = `
                    <div style="text-align: center; padding: 40px;">
                        <h3>Seu carrinho está vazio</h3>
                        <p style="color: #666;">Adicione produtos para continuar comprando.</p>
                        <br>
                        <a href="pg_produtos.html" class="btn-voltar" style="display: inline-block; width: auto; padding: 10px 20px;">Ver Produtos</a>
                    </div>
                `;
                atualizarResumo(0, 0);
                atualizarHeaderCarrinho(0);
                document.getElementById('btn-finalizar').style.pointerEvents = 'none';
                document.getElementById('btn-finalizar').style.opacity = '0.5';
                return;
            }

            document.getElementById('btn-finalizar').style.pointerEvents = 'auto';
            document.getElementById('btn-finalizar').style.opacity = '1';

            let precoTotalGeral = 0;
            let totalQtdItens = 0;

            carrinho.forEach((item, index) => {
                const dadosProduto = PRODUTOS_BD[item.id];

                if (dadosProduto) {
                    const subtotal = dadosProduto.preco * item.quantidade;
                    precoTotalGeral += subtotal;
                    totalQtdItens += item.quantidade;

                    const itemHtml = `
                        <div class="produto-item" style="display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 15px 0;">
                            <img src="${dadosProduto.imagem}" alt="${dadosProduto.nome}" style="width: 80px; height: auto;">
                            
                            <div class="produto-info" style="flex: 1; margin-left: 15px;">
                                <h2>${dadosProduto.nome}</h2>
                                <p>${dadosProduto.descricao}</p>
                            </div>
                            
                            <div class="produto-qtd" style="margin: 0 15px;">
                                <label>Quantidade:</label>
                                <input type="number" value="${item.quantidade}" min="1" onchange="alterarQuantidade(${index}, this.value)">
                            </div>
                            
                            <div class="produto-preco" style="text-align: right; min-width: 120px;">
                                <p style="font-weight: bold; font-size: 1.1rem;">R$ ${subtotal.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</p>
                                <button type="button" onclick="removerItem(${index})" style="background: none; border: none; color: red; cursor: pointer; font-size: 0.85rem; text-decoration: underline;">Remover</button>
                            </div>
                        </div>
                    `;
                    containerLista.innerHTML += itemHtml;
                }
            });

            atualizarResumo(precoTotalGeral, totalQtdItens);
            atualizarHeaderCarrinho(totalQtdItens);
        }

        function alterarQuantidade(index, novaQtd) {
            let carrinho = JSON.parse(localStorage.getItem(CHAVE_CARRINHO)) || [];
            const qtd = parseInt(novaQtd);

            if (qtd > 0) {
                carrinho[index].quantidade = qtd;
                localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho));
                renderizarCarrinho();
            }
        }

        function removerItem(index) {
            let carrinho = JSON.parse(localStorage.getItem(CHAVE_CARRINHO)) || [];
            carrinho.splice(index, 1);
            localStorage.setItem(CHAVE_CARRINHO, JSON.stringify(carrinho));
            renderizarCarrinho();
        }

        function atualizarResumo(total, totalItens) {
            document.getElementById('total-itens-texto').innerText = `Total (${totalItens} ${totalItens === 1 ? 'produto' : 'produtos'}):`;
            document.getElementById('preco-total').innerText = `R$ ${total.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
            
            const parcela = total / 10;
            document.getElementById('parcelamento-texto').innerText = `Em até 10x sem juros de R$ ${parcela.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`;
        }

        function atualizarHeaderCarrinho(totalItens) {
            const badge = document.getElementById('badge-carrinho');
            const iconeVazio = document.getElementById('icone-carrinho-vazio');
            const iconeCheio = document.getElementById('icone-carrinho-cheio');

            if (badge && iconeVazio && iconeCheio) {
                if (totalItens > 0) {
                    badge.innerText = totalItens;
                    badge.style.display = 'inline-block';
                    iconeVazio.style.display = 'none';
                    iconeCheio.style.display = 'inline-block';
                } else {
                    badge.style.display = 'none';
                    iconeVazio.style.display = 'inline-block';
                    iconeCheio.style.display = 'none';
                }
            }
        }
    </script>
</body>
</html>
