<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Essa linha abaixo é OBRIGATÓRIA para sites funcionarem em celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - IFG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Cabeçalho em Flexbox -->
    <header class="header">
        <img src="img/logo.png" alt="Logo do IFG" width="200">
        
        <nav>
            <ul class="menu">
                <li><a href="index.html">Página Inicial</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="contato.html">Contato</a></li>
                <li><a href="carrinho.html">Carrinho</a></li>
            </ul>
        </nav>
    </header>
    <title>Contato - MDG Informatica</title>
    <link rel="stylesheet" href="stylecontatosucesso.css">
</head>
<body>
    

    <!-- Formulário de Contato -->
    <main class="contato-container">
        <h1>Fale Conosco</h1>
        <p>Preencha o formulário abaixo e entraremos em contato.</p>
        
        <!-- O formulário usa GET para redirecionar para a página de sucesso -->
        <form action="contatosucesso.html" method="GET" class="form-contato">
            
            <div class="grupo-form">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
            </div>

            <div class="grupo-form">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
            </div>

            <div class="grupo-form">
                <label for="telefone">Telefone:</label>
                <!-- Atributo pattern exigido pelo projeto (aceita 10 ou 11 números) -->
                <input type="tel" id="telefone" name="telefone" placeholder="Somente números (Ex: 61999999999)" pattern="[0-9]{10,11}">
            </div>

            <div class="grupo-form">
                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto">
                    <option value="duvida">Dúvida</option>
                    <option value="sugestao">Sugestão</option>
                    <option value="reclamacao">Reclamação</option>
                    <option value="outro">Outro</option>
                </select>
            </div>

            <div class="grupo-form">
                <label for="mensagem">Mensagem:</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..." required></textarea>
            </div>

            <button type="submit" class="btn-enviar-contato">Enviar Mensagem</button>
        </form>
    </main>

    <!-- Rodapé (Padrão) -->
    <footer>
        <p>&copy; 2026 MDG Informatica.</p>
        
    </footer>
</body>
</html>
